<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" role="img" aria-labelledby="title desc" font-family="system-ui, 'Noto Sans CJK SC', sans-serif" fill="#eee5ea" font-size="14">
  <title id="title">桌面新增卡牌入口</title>
  <desc id="desc">旧桌面的开包面板、卡册批量操作、本体卡详情养成页签三处局部布局。数字为示意。</desc>
  <defs>
    <style>
      .frame{fill:#251c21;stroke:#594750} .line{stroke:#594750} .control{fill:#36282f;stroke:#64515b} .accent{fill:#4b2e3d;stroke:#a95a80} .dim{fill:#b9aab1} .pink{fill:#ffafd1} .good{fill:#a3d6ad} .danger{fill:#ffc0c0} .heading{font-size:17px;font-weight:700}
    </style>
  </defs>
  <text x="20" y="30" font-size="21" font-weight="700" fill="#c66595">桌面新增卡牌入口</text>
  <text x="20" y="53" class="dim">沿用旧桌面面板 · 局部示意 · 数值不代表正式配置</text>

  <g transform="translate(20 74)">
    <rect class="frame" width="440" height="162" rx="10"/>
    <text x="16" y="28" class="heading">开包 · 卡池列表下方</text>
    <path class="line" d="M16 43H424 M16 88H424"/>
    <text x="16" y="71" class="dim">普通卡包　黄金卡包　挂机卡包　…</text>
    <text x="16" y="117">挂机卡包</text>
    <text x="16" y="141" class="good">今日可领 12 包</text>
    <rect class="accent" x="338" y="103" width="86" height="32" rx="6"/>
    <text x="381" y="124" text-anchor="middle" class="pink">领取</text>
  </g>

  <g transform="translate(20 252)">
    <rect class="frame" width="440" height="254" rx="10"/>
    <text x="16" y="28" class="heading">卡册 · 批量处理</text>
    <rect class="control" x="16" y="43" width="62" height="28" rx="6"/>
    <text x="47" y="62" text-anchor="middle">分解</text>
    <rect class="accent" x="82" y="43" width="84" height="28" rx="6"/>
    <text x="124" y="62" text-anchor="middle" class="pink">NPC 回收</text>
    <text x="424" y="62" text-anchor="end" class="dim">本页全选　清空</text>
    <text x="16" y="96">已选 2 张 · 预计 +18 金币 · 今日还可回收 20 张</text>
    <path class="line" d="M16 110H424"/>
    <g text-anchor="middle">
      <rect class="accent" x="16" y="124" width="58" height="64" rx="6"/>
      <text x="45" y="162" class="pink">✓</text>
      <rect class="accent" x="84" y="124" width="58" height="64" rx="6"/>
      <text x="113" y="162" class="pink">✓</text>
      <rect class="control" x="152" y="124" width="58" height="64" rx="6"/>
      <text x="181" y="161" class="dim">本体</text>
    </g>
    <text x="16" y="218" class="danger">回收后卡牌消失，不可撤销</text>
    <rect class="accent" x="320" y="200" width="104" height="32" rx="6"/>
    <text x="372" y="221" text-anchor="middle" class="pink">确认回收</text>
  </g>

  <g transform="translate(476 74)">
    <rect class="frame" width="444" height="432" rx="10"/>
    <text x="16" y="28" class="heading">本体卡详情 · 养成</text>
    <text x="16" y="59" class="dim">概览</text>
    <text x="74" y="59" class="pink">养成</text>
    <text x="132" y="59" class="dim">技能</text>
    <path class="line" d="M16 73H428 M16 153H428 M16 379H428"/>
    <text x="16" y="98" class="dim">未解锁时在页签顶部显示条件，按钮不可用</text>
    <rect class="accent" x="16" y="109" width="158" height="30" rx="6"/>
    <text x="95" y="129" text-anchor="middle" class="pink">吞噬镜像 2/8</text>
    <text x="16" y="179" class="heading">共鸣 2/8</text>
    <g class="dim">
      <text x="16" y="209">攻击　● ○ ○　+0.5%</text>
      <text x="228" y="209">防御　○ ○ ○　+0%</text>
      <text x="16" y="232">速度　● ○ ○　+0.5%</text>
      <text x="228" y="232">暴击　○ ○ ○　+0%</text>
    </g>
    <text x="16" y="265">选择镜像卡</text>
    <g text-anchor="middle">
      <rect class="accent" x="16" y="277" width="124" height="81" rx="6"/>
      <text x="78" y="307">镜像卡</text>
      <text x="78" y="336" class="good">攻击 +0.5%</text>
      <rect class="control" x="151" y="277" width="124" height="81" rx="6"/>
      <text x="213" y="307">镜像卡</text>
      <text x="213" y="336" class="dim">仅升命座</text>
      <rect class="control" x="286" y="277" width="124" height="81" rx="6"/>
      <text x="348" y="307" class="dim">镜像卡</text>
      <text x="348" y="336" class="dim">已吞噬过</text>
    </g>
    <text x="16" y="407" class="danger">确认前显示命座、共鸣收益及材料消耗</text>
  </g>
</svg>
