<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choke! 音效试听</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#262b36; --txt:#e6e8ee; --mut:#8b93a5; --acc:#7aa2ff; --ok:#5fd38d; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.95); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 20px; }
  header h1 { margin:0 0 2px; font-size:16px; }
  header p { margin:0; color:var(--mut); font-size:12px; }
  header code { background:var(--panel); padding:1px 6px; border-radius:4px; color:var(--acc); }
  .bar { display:flex; gap:12px; align-items:center; margin-top:8px; flex-wrap:wrap; font-size:12px; color:var(--mut); }
  .bar input[type=range] { width:120px; }
  .bar button, .bar input[type=search] { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:4px 10px; font:inherit; }
  .bar button { cursor:pointer; }
  .bar button:hover { border-color:var(--acc); }
  main { max-width:980px; margin:0 auto; padding:8px 20px 80px; }
  h2 { margin:28px 0 8px; font-size:13px; letter-spacing:.08em; color:var(--mut); text-transform:uppercase; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .name { background:var(--panel); border:1px solid var(--line); border-radius:10px; margin:10px 0; padding:10px 12px; }
  .name.hidden { display:none; }
  .head { display:flex; align-items:center; gap:10px; }
  .head .t { font-weight:600; font-family:ui-monospace,Consolas,monospace; }
  .head .u { color:var(--mut); flex:1; }
  .btn { background:#222735; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--acc); }
  .v { display:flex; align-items:center; gap:8px; padding:5px 6px; margin-top:4px; border-radius:6px; border:1px solid transparent; cursor:pointer; }
  .v:hover { background:#1d212b; }
  .v.cur { border-color:var(--acc); background:#1a2132; }
  .v.playing .play { background:var(--acc); color:#0b0e14; }
  .v .play { width:28px; height:28px; border-radius:50%; border:0; background:#2a3042; color:var(--txt); cursor:pointer; flex:none; }
  .v .f { font-family:ui-monospace,Consolas,monospace; min-width:200px; }
  .v .d { color:var(--mut); width:48px; text-align:right; flex:none; font-variant-numeric:tabular-nums; }
  .v .s { color:var(--mut); flex:1; font-size:12px; }
  .tag { display:inline-block; font-size:11px; padding:0 6px; margin-left:6px; border-radius:8px; background:#2b2438; color:#c9a8ff; }
  .mark { border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:6px; width:28px; height:26px; cursor:pointer; flex:none; }
  .mark.on.keep { color:var(--ok); border-color:var(--ok); }
  .mark.on.drop { color:var(--bad); border-color:var(--bad); }
  #err { display:none; margin:20px; padding:12px; border:1px solid var(--bad); border-radius:8px; color:var(--bad); }
  kbd { background:var(--panel); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Choke! 音效试听(CC0 真实录音样本)</h1>
  <p>用 <code>pnpm dev</code> 打开 <code>http://localhost:5207/sfx-audition.html</code> · 样本来自 <code>/sfx/manifest.json</code>,出处见 <code>public/sfx/CREDITS.md</code></p>
  <div class="bar">
    <span><kbd>空格</kbd> 播放当前 · <kbd>↑</kbd><kbd>↓</kbd> 切换变体 · <kbd>←</kbd><kbd>→</kbd> 切换音名 · <kbd>A</kbd> 连播当前音名 · <kbd>K</kbd> 标记喜欢 · <kbd>X</kbd> 标记淘汰</span>
    <label>音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <input id="q" type="search" placeholder="筛选音名…">
    <button id="export">复制我的选择(JSON)</button>
    <span id="stat"></span>
  </div>
</header>
<div id="err"></div>
<main id="root"></main>

}
async function load(file) {
  if (!cache.has(file)) cache.set(file, fetch("/sfx/" + file).then(r => { if (!r.ok) throw new Error(file + " " + r.status); return r.arrayBuffer() }).then(b => ac().decodeAudioData(b)))
  return cache.get(file)
}
function stopAll() { playToken++; if (playingEl) { playingEl.classList.remove("playing"); playingEl = null } if (master) { master.disconnect(); master = ctx.createGain(); master.gain.value = +vol.value; master.connect(ctx.destination) } }
async function play(i, opts = {}) {
  const it = items[i]; if (!it) return
  setCur(i, !opts.keepScroll)
  ac()
  const buf = await load(it.file)
  const token = opts.token ?? ++playToken
  if (!opts.chain) stopAll(), (playToken = token)
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(master)
  if (playingEl) playingEl.classList.remove("playing")
  playingEl = it.el; it.el.classList.add("playing")
  src.start()
  return new Promise(res => { src.onended = () => { if (playingEl === it.el) { it.el.classList.remove("playing"); playingEl = null } res() } })
}
async function playAll(name) {
  ac(); stopAll()
  const token = ++playToken
  const idx = items.map((x, i) => x.name === name ? i : -1).filter(i => i >= 0)
  for (const i of idx) {
    if (token !== playToken) return
    await play(i, { chain: true, token, keepScroll: true })
    await new Promise(r => setTimeout(r, 250))
  }
}
function setCur(i, scroll = true) {
  if (cur >= 0 && items[cur]) items[cur].el.classList.remove("cur")
  cur = i
  const it = items[i]; it.el.classList.add("cur")
  if (scroll) it.el.scrollIntoView({ block: "center", behavior: "smooth" })
}
function setMark(i, kind) {
  const it = items[i]
  marks[it.file] = marks[it.file] === kind ? undefined : kind
  if (!marks[it.file]) delete marks[it.file]
  localStorage.setItem(MARK_KEY, JSON.stringify(marks))
  paintMarks()
}
function paintMarks() {
  let k = 0, d = 0
  for (const it of items) {
    const m = marks[it.file]
    it.keepBtn.classList.toggle("on", m === "keep"); it.dropBtn.classList.toggle("on", m === "drop")
    if (m === "keep") k++; if (m === "drop") d++
  }
  stat.textContent = "喜欢 " + k + " · 淘汰 " + d + " · 共 " + items.length + " 个变体"
}
function nameIndexes() { const seen = []; items.forEach((x, i) => { if (!seen.some(s => s.name === x.name)) seen.push({ name: x.name, first: i }) }); return seen }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }

async function main() {
  let manifest
  try {
    const r = await fetch("/sfx/manifest.json"); if (!r.ok) throw new Error(r.status)
    manifest = await r.json()
  } catch (e) {
    errEl.style.display = "block"
    errEl.textContent = "读取 /sfx/manifest.json 失败(" + e.message + ")。请用 pnpm dev 通过 http://localhost:5207/sfx-audition.html 打开,不要直接双击 html 文件。"
    return
  }
  const known = new Set(META.groups.flatMap(g => g[1]))
  const groups = META.groups.concat([["其他", Object.keys(manifest).filter(n => !known.has(n))]])
  for (const [title, names] of groups) {
    const present = names.filter(n => manifest[n] && manifest[n].length)
    if (!present.length) continue
    root.appendChild(el("h2", "", title))
    for (const name of present) {
      const box = el("div", "name"); box.dataset.name = name
      const head = el("div", "head")
      head.append(el("span", "t", name), el("span", "u", META.uses[name] || ""))
      const all = el("button", "btn", "▶ 全部连播"); all.onclick = () => playAll(name)
      head.append(all); box.append(head)
      manifest[name].forEach((file, vi) => {
        const row = el("div", "v")
        const pb = el("button", "play", "▶")
        const f = el("span", "f", file.split("/").pop())
        const d = el("span", "d", "")
        const s = el("span", "s", META.sources[file] || "")
        for (const t of META.flags[file] || []) s.append(el("span", "tag", t))
        const keep = el("button", "mark keep", "♥"); const drop = el("button", "mark drop", "✕")
        keep.title = "喜欢 (K)"; drop.title = "淘汰 (X)"
        row.append(pb, f, d, s, keep, drop)
        const idx = items.length
        items.push({ name, file, el: row, durEl: d, keepBtn: keep, dropBtn: drop, box })
        row.onclick = () => play(idx)
        keep.onclick = (e) => { e.stopPropagation(); setMark(idx, "keep") }
        drop.onclick = (e) => { e.stopPropagation(); setMark(idx, "drop") }
        box.append(row)
      })
      root.append(box)
    }
  }
  paintMarks()
  if (items.length) setCur(0, false)
  // 异步读取时长
  for (const it of items) fetch("/sfx/" + it.file).then(r => r.arrayBuffer()).then(b => new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 1, 44100).decodeAudioData(b)).then(buf => { it.durEl.textContent = buf.duration.toFixed(2) + "s" }).catch(() => {})
}

vol.oninput = () => { if (master) master.gain.value = +vol.value }
document.getElementById("q").oninput = (e) => {
  const q = e.target.value.trim().toLowerCase()
  document.querySelectorAll(".name").forEach(b => b.classList.toggle("hidden", q && !(b.dataset.name.includes(q) || (META.uses[b.dataset.name] || "").includes(q))))
}
document.getElementById("export").onclick = async () => {
  const keep = {}, drop = {}
  for (const it of items) { const m = marks[it.file]; if (m === "keep") (keep[it.name] ||= []).push(it.file); if (m === "drop") (drop[it.name] ||= []).push(it.file) }
  const text = JSON.stringify({ keep, drop }, null, 2)
  try { await navigator.clipboard.writeText(text); stat.textContent = "已复制到剪贴板" } catch { prompt("复制下面的内容", text) }
}
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "search") return
  if (!items.length) return
  const visible = (i) => !items[i].box.classList.contains("hidden")
  const move = (dir) => { let i = cur; do { i += dir } while (i >= 0 && i < items.length && !visible(i)); if (i >= 0 && i < items.length) setCur(i) }
  if (e.code === "Space") { e.preventDefault(); play(cur) }
  else if (e.key === "ArrowDown") { e.preventDefault(); move(1) }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(-1) }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault()
    const names = nameIndexes().filter(n => visible(n.first)); const at = names.findIndex(n => n.name === items[cur].name)
    const nx = names[at + (e.key === "ArrowRight" ? 1 : -1)]; if (nx) setCur(nx.first)
  }
  else if (e.key === "a" || e.key === "A") playAll(items[cur].name)
  else if (e.key === "k" || e.key === "K") setMark(cur, "keep")
  else if (e.key === "x" || e.key === "X") setMark(cur, "drop")
})
main()
</script>
</body>
</html>
